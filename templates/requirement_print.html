<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ r.name }} · {{ p.razon_social }}</title>
  <style>
    :root { color-scheme: light; }
    body { font-family: Georgia, "Times New Roman", serif; color: #1a1a1a; background: #fff; max-width: 760px; margin: 40px auto; padding: 0 24px; line-height: 1.6; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    .meta { color: #555; font-size: 14px; margin-bottom: 28px; font-family: Arial, sans-serif; }
    ul { padding-left: 22px; }
    .sign { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-top: 64px; font-family: Arial, sans-serif; font-size: 13px; }
    .sign div { border-top: 1px solid #333; padding-top: 6px; }
    .actions { font-family: Arial, sans-serif; margin-bottom: 24px; }
    .actions button { font: inherit; padding: 8px 16px; border-radius: 6px; border: 1px solid #005da7; background: #005da7; color: #fff; cursor: pointer; }
    @media print { .actions { display: none; } body { margin: 0 auto; } }
  </style>
  <script src="{{ url_for('static', filename='js/app.js') }}?v=4" defer></script>
</head>
<body>
  <div class="actions"><button type="button" data-print>Imprimir o guardar como PDF</button></div>
  <h1>{{ r.name }}</h1>
  <div class="meta">{{ company }} · {{ p.razon_social }} · CUIT {{ p.cuit }} · {{ today | fecha(False) }}</div>
  <div>{{ body | md }}</div>
  <div class="sign">
    <div>Firma y aclaración del apoderado</div>
    <div>DNI y cargo</div>
  </div>
</body>
</html>
